name: repository

# Checks that hold for the repository as a whole.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reuse:
    name: Licence of every file (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: pipx run --spec 'reuse[charset-normalizer]==6.2.0' reuse lint
