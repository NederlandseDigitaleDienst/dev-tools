version: 2
# One entry per tool and ecosystem: every tool has its own lockfiles.
#
# Een nieuwe versie moet vijf dagen bestaan voordat Dependabot er een PR van
# maakt; registry-compromitteringen worden meestal binnen dagen ontdekt en
# ingetrokken. Security-updates vallen er buiten en komen onmiddellijk.
updates:
  - package-ecosystem: cargo
    directory: /tools/code-guide
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore(deps)
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /tools/code-guide/ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps)
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore(ci)
