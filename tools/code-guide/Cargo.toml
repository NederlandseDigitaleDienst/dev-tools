# code-guide — a guide to a Rust workspace, built on rust-analyzer.
#
# A standalone tool: its own workspace, lockfile and toolchain, independent of
# the other tools in this repository and of the workspace it describes.
# `code-guide index` has rust-analyzer write a SCIP index of a workspace and
# caches it; `code-guide serve` turns the index into crates, modules, types and
# the calls between their functions, and serves the app in `ui/`. See README.md.
[package]
name = "code-guide"
version = "0.1.0"
edition = "2021"
description = "A guide to a Rust workspace, layered by the calls between its functions as rust-analyzer resolves them"
license = "EUPL-1.2"
repository = "https://github.com/NederlandseDigitaleDienst/dev-tools"
homepage = "https://github.com/NederlandseDigitaleDienst/dev-tools/tree/main/tools/code-guide"
publish = false

[[bin]]
name = "code-guide"
path = "src/main.rs"

[dependencies]
# Reading rust-analyzer's SCIP index: the published schema and symbol parser.
scip = "0.10"
protobuf = "3"
# Workspace members, their directories and the shared target dir.
cargo_metadata = "0.23"
# What the index does not hold: visibility, exact item extents in
# macro-generated code, and which code is test-only.
syn = { version = "3", features = ["full", "visit", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
sha2 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.7", features = ["fs"] }

[lints.clippy]
# A tool that crashes reports nothing useful: errors are returned and shown.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# A workspace of its own, so it never joins a workspace it happens to sit in.
[workspace]
